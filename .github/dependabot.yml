# Mises à jour proposées automatiquement (une demande de fusion par lot) : chaque proposition passe les
# contrôles du dépôt (types, tests, construction) avant de pouvoir être acceptée.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      # Correctifs et petites versions ensemble ; une grande version (qui peut casser) arrive seule.
      petites-mises-a-jour:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
