      Ouverture : la boucle de l'icône se trace, un point la parcourt, puis « Boucle » monte, le temps que l'app
      et la carte se chargent dessous. Seulement des animations d'opacité et de déplacement : la carte graphique

      #intro .ib { display: grid; justify-items: center; gap: 18px; transition: transform 560ms cubic-bezier(0.5, 0, 0.75, 0), opacity 400ms ease; will-change: transform, opacity; }
      #intro .loop { position: relative; width: 200px; height: 160px; animation: ib-beat 1.2s ease-in-out 1.05s infinite; will-change: transform; }
      #intro .loop > svg { position: absolute; inset: 0; overflow: visible; }
      #intro .glow { opacity: 0; animation: ib-in 700ms ease-out 500ms forwards; will-change: opacity; }
      #intro .glow polyline { fill: none; stroke: #ff2d55; stroke-width: 16; stroke-linejoin: round; filter: blur(9px); opacity: 0.3; }
      #intro .sg { opacity: 0; animation: ib-in 140ms linear forwards; animation-delay: calc(80ms + var(--i) * 34ms); will-change: opacity; }
      #intro .sg polyline { fill: none; stroke: #ff3b62; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      #intro .start { position: absolute; left: 36.9px; top: 124.4px; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 5px #ff2d55;
        animation: ib-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1) both; will-change: transform; }
      #intro .dot { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform;
        animation: ib-run 900ms cubic-bezier(0.65, 0, 0.35, 1) 80ms both, ib-run 1.3s linear 980ms infinite; }
      #intro .dot::after { content: ""; position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #fff;

      #intro .word { margin: 0; font: 700 34px/1 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif; letter-spacing: -0.035em; color: #fff;

      #intro.out { opacity: 0; }
      #intro.out .ib { transform: scale(2.2); opacity: 0; }
      @keyframes ib-in { to { opacity: 1; } }
      @keyframes ib-pop { from { transform: scale(0); } }
      @keyframes ib-rise { to { opacity: 1; transform: none; } }

nslate(36.9px, 124.4px); } }
